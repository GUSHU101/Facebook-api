# Concrete Baota / aaPanel vhost for pixel.atelierwrap.cc.
# Public HTTPS: 8443 (TCP and UDP for HTTP/3)
# Internal Node.js: 127.0.0.1:3000
# Do not add a 443 listener to this file.

server
{
    listen 80;
    server_name pixel.atelierwrap.cc;
    server_tokens off;
    index index.html index.htm default.htm default.html;

    include /www/server/panel/vhost/nginx/extension/server/*.conf;
    include /www/server/panel/vhost/nginx/well-known/server.conf;

    location /.well-known/ {
        root /www/wwwroot/Facebook-api-main;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }

    access_log /www/wwwlogs/server_80.log;
    error_log  /www/wwwlogs/server_80.error.log;
}

server
{
    listen 8443 ssl;
    listen 8443 quic;
    http2 on;
    http3 on;
    server_name pixel.atelierwrap.cc;
    server_tokens off;
    index index.html index.htm default.htm default.html;

    include /www/server/panel/vhost/nginx/extension/server/*.conf;

    ssl_certificate     /www/server/panel/vhost/cert/server/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/server/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'h3=":8443"; ma=86400' always;
    quic_retry on;
    quic_gso on;

    # Plain HTTP accidentally sent to the TLS port must stay on 8443.
    error_page 497 https://$host:8443$request_uri;

    client_max_body_size 2m;

    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime|backups)/ {
        return 404;
    }

    location /.well-known/ {
        root /www/wwwroot/Facebook-api-main;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    access_log /www/wwwlogs/server.log;
    error_log  /www/wwwlogs/server.error.log;
}
