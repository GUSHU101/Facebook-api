name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed admin assets
        run: |
          npm run build:admin
          git diff --exit-code -- src/public/admin.css src/public/vue.global.prod.js

      - name: Syntax check
        run: npm run check

      - name: Deployment shell syntax check
        run: bash -n deploy/install_ubuntu.sh scripts/backup.sh scripts/restore.sh

      - name: Unit tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify production-only install
        run: |
          npm ci --omit=dev --ignore-scripts
          npm run check
          npm test
